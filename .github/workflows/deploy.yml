name: Deploy wiki to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # a newer push replaces a build still running

env:
  # Quartz is pinned to a known commit; bump this to upgrade.
  QUARTZ_REF: 7cfb0796165c848be5438117e9806802123bf676

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out vault
        uses: actions/checkout@v6
        with:
          path: vault
          fetch-depth: 0 # full history so page dates come from git
          persist-credentials: false
      - name: Check out Quartz
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: ${{ env.QUARTZ_REF }}
          path: quartz
          persist-credentials: false
      - name: Apply site config
        run: cp vault/.quartz-site/* quartz/
      - name: Turn links to private notes into plain text
        run: python3 -I vault/.github/scripts/unlink.py vault vault/.quartz-site/unlinked-notes.txt
      - name: Leave hidden sections out of the site
        run: python3 -I vault/.github/scripts/hide_sections.py vault vault/.quartz-site/hidden-sections.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('vault/.quartz-site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        working-directory: quartz
        run: npm ci
      - name: Install Quartz plugins
        working-directory: quartz
        run: npx quartz plugin install
      - name: Build site
        working-directory: quartz
        run: npx quartz build -d ../vault -o public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
